name: Bug Report
description: Create a report to help us improve the GameVault Steam Plugin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.
  - type: input
    id: gamevault-version
    attributes:
      label: GameVault Server Version
      description: What version of GameVault backend are you running? (e.g., 17.2.0)
      placeholder: "17.2.0"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      description: What version of the Steam plugin is installed?
      placeholder: "2.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Set environment variables ...
        2. Start GameVault server
        3. Observe logs under SteamMetadataProviderService / SteamLibrarySyncService
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste relevant logs from `docker logs gamevault-backend`
      render: shell
